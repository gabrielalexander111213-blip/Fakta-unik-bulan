<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Perjalanan ke Bulan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: adegan 3D memenuhi layar; panel kaca di atas (judul dan progres), teks narasi di bawah, tombol kontrol paling bawah. Satu tampilan gelap angkasa, semua teks putih, tombol bergaya Liquid Glass. */
:root {
  --fg: #ffffff;
  --line: rgba(255, 255, 255, 0.2);
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --sky-top: #3b8fe8;
  --sky-bot: #bfe3ff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: #02030a; color: var(--fg); font-family: var(--font); overflow: hidden; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }

#sky { position: fixed; inset: 0; background: linear-gradient(180deg, var(--sky-top), var(--sky-bot)); }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 0.6s var(--ease); }
#fade.on { opacity: 1; }

.glass {
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.05));
  border: 1px solid rgba(255, 255, 255, 0.24);
  backdrop-filter: blur(18px) saturate(160%);
  -webkit-backdrop-filter: blur(18px) saturate(160%);
  box-shadow: 0 14px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.45);
}

.btn {
  position: relative; isolation: isolate; overflow: hidden;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 13px 20px; font: 600 14px/1 var(--font); color: var(--fg); white-space: nowrap; cursor: pointer;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.05));
  border: 1px solid rgba(255, 255, 255, 0.26); border-radius: 999px;
  backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%);
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.55);
  transition: transform 0.35s var(--ease), border-color 0.35s, box-shadow 0.35s;
}
.btn::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, 0.38) 48%, transparent 66%); transform: translateX(-120%); transition: transform 0.8s var(--ease); }
.btn:hover { transform: translateY(-2px); border-color: rgba(255, 255, 255, 0.5); }
.btn:hover::before { transform: translateX(120%); }
.btn:active { transform: scale(0.96); }
.btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.primary { padding: 16px 30px; font-size: 16px; background: linear-gradient(135deg, rgba(120, 165, 255, 0.55), rgba(115, 90, 255, 0.28)); border-color: rgba(190, 210, 255, 0.55); box-shadow: 0 12px 38px rgba(80, 90, 255, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.7); }
body.ended #replayBtn { background: linear-gradient(135deg, rgba(120, 165, 255, 0.55), rgba(115, 90, 255, 0.28)); border-color: rgba(190, 210, 255, 0.6); }

.top {
  position: fixed; z-index: 5;
  top: calc(12px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 760px; margin-inline: auto;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px;
  padding: 12px 18px 14px; border-radius: 22px;
}
.brand { font-weight: 800; font-size: 16px; letter-spacing: -0.01em; }
.step-label { font-size: 13px; font-weight: 600; opacity: 0.9; }
.progress { flex-basis: 100%; display: flex; gap: 4px; }
.progress i { flex: 1; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, 0.22); transition: background 0.4s; }
.progress i.done { background: rgba(255, 255, 255, 0.9); }
.progress i.now { background: rgba(160, 200, 255, 1); box-shadow: 0 0 10px rgba(130, 180, 255, 0.9); }

.caption {
  position: fixed; z-index: 5; left: 50%;
  bottom: calc(86px + env(safe-area-inset-bottom, 0px));
  width: min(760px, calc(100% - 32px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
  padding: 18px 22px; border-radius: 24px;
  opacity: 0; transform: translateX(-50%) translateY(16px);
  transition: opacity 0.5s var(--ease), transform 0.5s var(--ease);
  pointer-events: none;
}
.caption.show { opacity: 1; transform: translateX(-50%); }
.cap-kicker { margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.85; }
.cap-text { margin: 0; font-size: clamp(16px, 2.3vw, 20px); line-height: 1.6; font-weight: 500; text-wrap: pretty; }

.controls {
  position: fixed; z-index: 6; left: 0; right: 0;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
  opacity: 0; pointer-events: none; transition: opacity 0.6s var(--ease);
}
body.started .controls { opacity: 1; pointer-events: auto; }

.badge {
  position: fixed; z-index: 5; top: 34%;
  right: max(16px, env(safe-area-inset-right, 0px));
  min-width: 128px; padding: 12px 18px; border-radius: 18px;
  opacity: 0; transform: translateX(24px); transition: opacity 0.6s var(--ease), transform 0.6s var(--ease);
}
.badge.cold { top: calc(34% + 92px); }
.badge.show { opacity: 1; transform: none; }
.badge small { display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.85; }
.badge b { display: block; font-size: 28px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; }

.overlay {
  position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
  padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));
  background: radial-gradient(ellipse at 50% 40%, rgba(5, 8, 26, 0.3), rgba(2, 3, 10, 0.8));
  transition: opacity 0.7s var(--ease), visibility 0s 0.7s;
}
body.started .overlay { opacity: 0; visibility: hidden; pointer-events: none; }
.card { width: min(520px, 100%); padding: 32px 28px; border-radius: 30px; text-align: center; animation: rise 0.9s var(--ease) both; }
.card .kicker { margin: 0 0 10px; font-size: 12px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.85; }
.card h1 { margin: 0; font-size: clamp(34px, 8vw, 52px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; text-wrap: balance; text-shadow: 0 0 50px rgba(111, 177, 255, 0.55); }
.card p.lead { margin: 16px 0 26px; font-size: 17px; line-height: 1.65; }
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.voice-status {
  position: fixed; z-index: 6;
  top: calc(104px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 760px; margin-inline: auto; padding: 12px 18px; border-radius: 18px;
  font-size: 14px; line-height: 1.5;
}
.card .note { margin: 18px 0 0; font-size: 13px; line-height: 1.5; opacity: 0.8; }

@keyframes rise { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition-duration: 0.01s !important; } }
</style>

<div id="sky"></div>
<canvas id="scene" aria-label="Animasi 3D astronot naik roket dari Bumi ke Bulan" role="img"></canvas>
<div id="fade"></div>

<header class="top glass">
  <span class="brand">Perjalanan ke Bulan</span>
  <span class="step-label" id="stepLabel"></span>
  <div class="progress" id="progress" aria-hidden="true"></div>
</header>

<div class="badge hot glass" id="badgeHot"><small>Siang hari</small><b>+127 °C</b></div>
<div class="badge cold glass" id="badgeCold"><small>Malam hari</small><b>−173 °C</b></div>

<div class="voice-status glass" id="voiceStatus" role="status" hidden></div>

<div class="caption glass" id="caption" aria-live="polite">
  <p class="cap-kicker" id="capKicker"></p>
  <p class="cap-text" id="capText"></p>
</div>

<div class="controls" id="controls">
  <button class="btn" id="pauseBtn" type="button">Jeda</button>
  <button class="btn" id="skipBtn" type="button">Lewati</button>
  <button class="btn" id="replayBtn" type="button">Ulangi</button>
  <button class="btn" id="voiceBtn" type="button" aria-pressed="true">Suara: Nyala</button>
</div>

<div class="overlay" id="overlay">
  <div class="card glass">
    <p class="kicker">Fakta unik Bulan</p>
    <h1>Perjalanan ke Bulan</h1>
    <p class="lead">Ikut astronot kecil naik roket dari Bumi, mendarat di Bulan, lalu dengarkan lima fakta yang belum banyak orang tahu.</p>
    <div class="actions">
      <button class="btn primary" id="startBtn" type="button">Mulai Perjalanan</button>
      <button class="btn" id="testBtn" type="button">Tes suara</button>
    </div>
    <p class="note" id="startNote">Nyalakan suara perangkatmu agar narasinya terdengar.</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';
  var THREE = window.THREE;
  var $ = function (id) { return document.getElementById(id); };
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function smooth(a, b, x) { var t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }

  /* ---------- Renderer, kamera, dunia ---------- */
  var renderer;
  try {
    if (!THREE) throw new Error('three');
    renderer = new THREE.WebGLRenderer({ canvas: $('scene'), antialias: true, alpha: true });
  } catch (err) {
    $('startNote').textContent = 'Browser atau perangkat ini tidak mendukung grafik 3D (WebGL), jadi animasinya tidak bisa ditampilkan.';
    $('startBtn').disabled = true;
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 0);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(48, 1, 0.1, 30000);
  var spaceWorld = new THREE.Group();
  var moonWorld = new THREE.Group();
  scene.add(spaceWorld);
  scene.add(moonWorld);

  function addLights(group, amb, sun, p) {
    group.add(new THREE.AmbientLight(0xaab8ff, amb));
    var d = new THREE.DirectionalLight(0xffffff, sun);
    d.position.set(p[0], p[1], p[2]);
    group.add(d);
  }
  addLights(spaceWorld, 0.65, 1.0, [60, 100, 80]);
  addLights(moonWorld, 0.3, 1.5, [50, 35, 40]);

  /* ---------- Tekstur dari kanvas ---------- */
  function canvasTex(w, h, draw) {
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    var t = new THREE.CanvasTexture(c);
    t.anisotropy = 4;
    return t;
  }

  var earthTex = canvasTex(1024, 512, function (g, w, h) {
    var gr = g.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, '#1c5fc0'); gr.addColorStop(1, '#2a82e6');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    var i, j, x, y;
    for (i = 0; i < 26; i++) {
      x = rnd(0, w); y = rnd(h * 0.2, h * 0.8);
      g.fillStyle = Math.random() < 0.75 ? '#3aa65a' : '#c9b57a';
      for (j = 0; j < 9; j++) { g.beginPath(); g.arc(x + rnd(-60, 60), y + rnd(-35, 35), rnd(18, 52), 0, 6.283); g.fill(); }
    }
    g.fillStyle = 'rgba(255,255,255,0.55)';
    for (i = 0; i < 60; i++) { g.beginPath(); g.ellipse(rnd(0, w), rnd(0, h), rnd(30, 90), rnd(6, 14), rnd(-0.4, 0.4), 0, 6.283); g.fill(); }
  });

  var moonTex = canvasTex(1024, 512, function (g, w, h) {
    g.fillStyle = '#a3a3a8'; g.fillRect(0, 0, w, h);
    var i, x, y, r;
    for (i = 0; i < 90; i++) { g.fillStyle = 'rgba(80,80,90,0.18)'; g.beginPath(); g.arc(rnd(0, w), rnd(0, h), rnd(30, 90), 0, 6.283); g.fill(); }
    for (i = 0; i < 220; i++) {
      x = rnd(0, w); y = rnd(0, h); r = rnd(4, 26);
      g.fillStyle = 'rgba(60,60,70,0.35)'; g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fill();
      g.strokeStyle = 'rgba(230,230,235,0.35)'; g.lineWidth = 1.5; g.beginPath(); g.arc(x - r * 0.12, y - r * 0.12, r, 0, 6.283); g.stroke();
    }
  });

  /* ---------- Dunia Bumi dan antariksa ---------- */
  var earth = new THREE.Mesh(new THREE.SphereGeometry(300, 96, 64), new THREE.MeshStandardMaterial({ map: earthTex, roughness: 0.9 }));
  earth.position.y = -300; earth.rotation.x = Math.PI / 2;
  var cap = new THREE.Mesh(new THREE.SphereGeometry(300.25, 64, 8, 0, Math.PI * 2, 0, 0.2), new THREE.MeshStandardMaterial({ color: 0x4fb35f, roughness: 1 }));
  cap.position.y = -300;
  var glow = new THREE.Mesh(new THREE.SphereGeometry(318, 64, 48), new THREE.MeshBasicMaterial({ color: 0x6db4ff, transparent: true, opacity: 0.2, side: THREE.BackSide, blending: THREE.AdditiveBlending, depthWrite: false }));
  glow.position.y = -300;
  var moonGlobe = new THREE.Mesh(new THREE.SphereGeometry(160, 64, 48), new THREE.MeshStandardMaterial({ map: moonTex, roughness: 1 }));
  moonGlobe.position.set(40, 2600, -100);
  spaceWorld.add(earth, cap, glow, moonGlobe);

  var launchSite = new THREE.Group();
  var pad = new THREE.Mesh(new THREE.CylinderGeometry(3.4, 3.6, 0.4, 32), new THREE.MeshStandardMaterial({ color: 0x8d939c, roughness: 0.8 }));
  pad.position.y = 0.2;
  launchSite.add(pad);
  var towerMat = new THREE.MeshStandardMaterial({ color: 0xd0533a, roughness: 0.7 });
  [-0.6, 0.6].forEach(function (z) {
    var c = new THREE.Mesh(new THREE.BoxGeometry(0.22, 9, 0.22), towerMat);
    c.position.set(-3.6, 4.5, z); launchSite.add(c);
  });
  for (var k = 1; k <= 5; k++) {
    var beam = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.16, 1.4), towerMat);
    beam.position.set(-3.6, k * 1.6, 0); launchSite.add(beam);
  }
  var arm = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.2, 0.4), towerMat);
  arm.position.set(-2.2, 5.4, 0); launchSite.add(arm);
  var treeMat = new THREE.MeshStandardMaterial({ color: 0x2f7d46, roughness: 1 });
  for (var n = 0; n < 16; n++) {
    var ang = rnd(0, 6.283), dist = rnd(14, 48);
    var tree = new THREE.Mesh(new THREE.ConeGeometry(rnd(0.9, 1.6), rnd(3, 5), 8), treeMat);
    tree.position.set(Math.cos(ang) * dist, 1.8 - (dist * dist) / 600, Math.sin(ang) * dist - 4);
    if (Math.abs(tree.position.x) < 6 && tree.position.z > -6 && tree.position.z < 8) tree.position.x += 12;
    launchSite.add(tree);
  }
  spaceWorld.add(launchSite);

  var starGeo = new THREE.BufferGeometry();
  var sp = new Float32Array(1800 * 3);
  for (var s = 0; s < 1800; s++) {
    var u = Math.random() * 2 - 1, a = Math.random() * 6.283, q = Math.sqrt(1 - u * u), R = 12000;
    sp[s * 3] = R * q * Math.cos(a); sp[s * 3 + 1] = R * u; sp[s * 3 + 2] = R * q * Math.sin(a);
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(sp, 3));
  var starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 2, sizeAttenuation: false, transparent: true, opacity: 0, depthWrite: false });
  var stars = new THREE.Points(starGeo, starMat);
  stars.frustumCulled = false;
  scene.add(stars);

  /* ---------- Dunia Bulan ---------- */
  var groundGeo = new THREE.PlaneGeometry(500, 500, 120, 120);
  groundGeo.rotateX(-Math.PI / 2);
  var craters = [], ci, cj;
  for (ci = 0; ci < 34; ci++) {
    var ca = rnd(0, 6.283), cd = rnd(32, 220);
    craters.push({ x: Math.cos(ca) * cd, z: Math.sin(ca) * cd, r: rnd(5, 16) });
  }
  var gp = groundGeo.attributes.position;
  for (ci = 0; ci < gp.count; ci++) {
    var gx = gp.getX(ci), gz = gp.getZ(ci), gd = Math.sqrt(gx * gx + gz * gz);
    var hgt = (Math.sin(gx * 0.11) * Math.cos(gz * 0.09) * 1.6 + Math.sin(gx * 0.31 + gz * 0.23) * 0.5) * smooth(14, 40, gd);
    for (cj = 0; cj < craters.length; cj++) {
      var cr = craters[cj], qd = Math.sqrt((gx - cr.x) * (gx - cr.x) + (gz - cr.z) * (gz - cr.z)) / cr.r;
      if (qd < 1) hgt -= (1 - qd * qd) * cr.r * 0.22;
      if (qd > 0.85 && qd < 1.35) hgt += Math.exp(-Math.pow((qd - 1.05) * 6, 2)) * cr.r * 0.06;
    }
    gp.setY(ci, hgt);
  }
  groundGeo.computeVertexNormals();
  moonWorld.add(new THREE.Mesh(groundGeo, new THREE.MeshStandardMaterial({ color: 0x9b9ba2, roughness: 1, flatShading: true })));

  var rockMat = new THREE.MeshStandardMaterial({ color: 0x85858c, roughness: 1, flatShading: true });
  for (ci = 0; ci < 14; ci++) {
    var rk = new THREE.Mesh(new THREE.DodecahedronGeometry(rnd(0.3, 0.9), 0), rockMat);
    var ra = rnd(0, 6.283), rd = rnd(9, 18);
    rk.position.set(Math.cos(ra) * rd, 0.1, Math.sin(ra) * rd - 3);
    rk.rotation.set(rnd(0, 3), rnd(0, 3), rnd(0, 3));
    moonWorld.add(rk);
  }

  var skyEarth = new THREE.Mesh(new THREE.SphereGeometry(18, 48, 32), new THREE.MeshStandardMaterial({ map: earthTex, roughness: 0.9, emissive: 0x0a1a3a }));
  skyEarth.position.set(-34, 30, -80);
  skyEarth.rotation.set(0.3, 0.5, 0.2);
  moonWorld.add(skyEarth);

  /* ---------- Langit ---------- */
  var skyEl = $('sky'), lastK = -1;
  var dayTop = new THREE.Color(0x3b8fe8), dayBot = new THREE.Color(0xbfe3ff);
  var spTop = new THREE.Color(0x01020a), spBot = new THREE.Color(0x070b24);
  var tA = new THREE.Color(), tB = new THREE.Color();
  function setSky(kk) {
    kk = clamp(kk, 0, 1);
    if (Math.abs(kk - lastK) < 0.002) return;
    lastK = kk;
    tA.copy(dayTop).lerp(spTop, kk);
    tB.copy(dayBot).lerp(spBot, kk);
    skyEl.style.setProperty('--sky-top', '#' + tA.getHexString());
    skyEl.style.setProperty('--sky-bot', '#' + tB.getHexString());
    starMat.opacity = smooth(0.3, 0.9, kk);
  }

  /* ---------- Roket ---------- */
  function mat(c, o) {
    o = o || {};
    return new THREE.MeshStandardMaterial({ color: c, roughness: o.r == null ? 0.5 : o.r, metalness: o.m || 0, transparent: !!o.t, opacity: o.o == null ? 1 : o.o });
  }
  function mesh(geo, m, x, y, z) {
    var o = new THREE.Mesh(geo, m);
    o.position.set(x || 0, y || 0, z || 0);
    return o;
  }

  var rocket = new THREE.Group();
  rocket.add(mesh(new THREE.CylinderGeometry(0.9, 0.9, 5, 32), mat(0xf3f5fa, { r: 0.35 }), 0, 3, 0));
  rocket.add(mesh(new THREE.ConeGeometry(0.9, 1.9, 32), mat(0xff5a3c, { r: 0.4 }), 0, 6.45, 0));
  rocket.add(mesh(new THREE.CylinderGeometry(0.93, 0.93, 0.55, 32), mat(0xff5a3c, { r: 0.4 }), 0, 1.9, 0));
  rocket.add(mesh(new THREE.CylinderGeometry(0.55, 0.75, 0.55, 24), mat(0x3a3f4b, { r: 0.6, m: 0.4 }), 0, 0.28, 0));
  var win = mesh(new THREE.SphereGeometry(0.42, 24, 16), mat(0x8fd0ff, { r: 0.1, m: 0.6 }), 0, 4.3, 0.74);
  win.scale.z = 0.55;
  rocket.add(win);
  rocket.add(mesh(new THREE.TorusGeometry(0.44, 0.07, 12, 32), mat(0xc9ced8, { r: 0.3, m: 0.6 }), 0, 4.3, 0.8));
  for (var fi = 0; fi < 3; fi++) {
    var finPivot = new THREE.Group();
    finPivot.add(mesh(new THREE.BoxGeometry(0.16, 1.7, 1.1), mat(0xff5a3c, { r: 0.4 }), 0, 0, 0.95));
    finPivot.position.y = 1.15;
    finPivot.rotation.y = fi * Math.PI * 2 / 3;
    rocket.add(finPivot);

  function finishAll() {
    running = false;
    segs.forEach(function (s) { s.className = 'done'; });
    document.body.classList.add('ended');
    pauseBtn.textContent = 'Jeda';
  }
  function next() {
    if (cur >= steps.length - 1) { finishAll(); return; }
    goStep(cur + 1, false);
  }
  function say(st) {
    curSay = st.say || st.text;
    capKick.textContent = st.kicker || '';
    capKick.hidden = !st.kicker;
    capText.textContent = st.text;
    capEl.classList.add('show');
    speak(curSay);
  }

  /* ---------- Tombol ---------- */
  $('startBtn').addEventListener('click', function () {
    if (started) return;
    started = true;
    document.body.classList.add('started');
    pickVoice();
    goStep(0, true);
    running = true;
    spoken = true;
    say(steps[0]);
  });
  $('testBtn').addEventListener('click', function () {
    pickVoice();
    if (!synth || typeof SpeechSynthesisUtterance === 'undefined') {
      startNote.textContent = 'Browser ini tidak mendukung suara (TTS), jadi narasi hanya tampil sebagai teks.';
      return;
    }
    var n = (synth.getVoices() || []).length;
    startNote.textContent = 'Menguji suara... ' + (idVoice ? 'Suara bahasa Indonesia ditemukan.' : (n ? 'Suara bahasa Indonesia tidak ditemukan, memakai suara lain.' : 'Belum ada suara yang terdeteksi.'));
    speak('Halo, ini tes suara. Kalau kamu mendengar ini, suaranya berfungsi.');
  });
  pauseBtn.addEventListener('click', function () {
    if (!started || document.body.classList.contains('ended')) return;
    running = !running;
    pauseBtn.textContent = running ? 'Jeda' : 'Lanjut';
    if (!running) cancelSpeech();
    else if (spoken && !speechDone) speak(curSay);
    else if (spoken && speechDone) { /* kalimat sudah selesai */ }
  });
  $('skipBtn').addEventListener('click', function () {
    if (!started) return;
    if (!running && !document.body.classList.contains('ended')) { running = true; pauseBtn.textContent = 'Jeda'; }
    next();
  });
  $('replayBtn').addEventListener('click', function () {
    if (!started) return;
    document.body.classList.remove('ended');
    goStep(0, true);
    running = true;
    pauseBtn.textContent = 'Jeda';
  });
  voiceBtn.addEventListener('click', function () {
    voiceOn = !voiceOn;
    voiceBtn.textContent = voiceOn ? 'Suara: Nyala' : 'Suara: Mati';
    voiceBtn.setAttribute('aria-pressed', voiceOn ? 'true' : 'false');
    if (!voiceOn) cancelSpeech();
    if (started && running && spoken && !speechDone) speak(curSay);
    else if (!voiceOn && spoken && !speechDone) speechDone = true;
  });

  /* ---------- Ukuran layar ---------- */
  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = (w / h < 0.85) ? 64 : 48;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  /* ---------- Putaran gambar ---------- */
  var last = performance.now();
  function frame(now) {
    var dtReal = Math.min(0.05, (now - last) / 1000);
    last = now;
    var dt = running ? dtReal : 0;
    clock += dt;
    if (running) stepTime += dt;
    shake = 0;

    var st = steps[cur];
    if (st) {
      if (running && !spoken && stepTime >= st.delay) { spoken = true; say(st); }
      st.update(stepTime, dt);
      if (running && stepTime >= st.dur && spoken && speechDone) next();
    }

    A.talking = speaking && running;
    animAstro(clock, dt);

    var fl = rocketFlame;
    flame.visible = fl > 0.02;
    flame.scale.set(fl, fl * (1 + Math.sin(clock * 45) * (reduce ? 0 : 0.12)), fl);

    if (world === 'space') {
      var alt = rocket.position.y;
      setSky(clamp((alt - 20) / 600, 0, 1));
      cap.visible = alt < 140;
      launchSite.visible = alt < 400;
      if (running && fl > 0.3 && alt < 120) {
        puffAcc += dt * 18;
        while (puffAcc >= 1) { puffAcc -= 1; emitPuff(rocket.position.x, rocket.position.y, rocket.position.z); }
      }
    } else {
      setSky(1);
    }
    updatePuffs(dt);

    var kk = 1 - Math.exp(-dtReal * camRate);
    camPos.lerp(camTarget, kk);
    camLook.lerp(lookTarget, kk);
    camera.position.set(camPos.x + (Math.random() - 0.5) * shake, camPos.y + (Math.random() - 0.5) * shake, camPos.z);
    camera.lookAt(camLook);
    stars.position.copy(camera.position);

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  goStep(0, true);
  snapCam();
  requestAnimationFrame(frame);
})();
</script>

</body></html>
